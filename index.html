<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game {
            width: 360px;
            max-width: 92%;
            padding: 25px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            color: #555;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 12px;
            background: #eeeeee;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background: #dddddd;
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        #newGame {
            margin-top: 20px;
            padding: 13px 28px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #newGame:hover {
            background: #4f63c5;
        }

        @media (max-width: 400px) {
            .game {
                padding: 20px;
            }

            .cell {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>⭕ Tic Tac Toe ❌</h1>

        <h2 id="status">Player X Turn</h2>

        <div class="board">

            <button class="cell" onclick="playGame(0)"></button>
            <button class="cell" onclick="playGame(1)"></button>
            <button class="cell" onclick="playGame(2)"></button>

            <button class="cell" onclick="playGame(3)"></button>
            <button class="cell" onclick="playGame(4)"></button>
            <button class="cell" onclick="playGame(5)"></button>

            <button class="cell" onclick="playGame(6)"></button>
            <button class="cell" onclick="playGame(7)"></button>
            <button class="cell" onclick="playGame(8)"></button>

        </div>

        <button id="newGame" onclick="newGame()">
            🔄 New Game
        </button>

    </div>


    <script>

        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];

        let currentPlayer = "X";

        let gameOver = false;

        const cells = document.querySelectorAll(".cell");

        const status = document.getElementById("status");


        function playGame(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            cells[index].textContent = currentPlayer;

            if (currentPlayer === "X") {
                cells[index].classList.add("x");
            } else {
                cells[index].classList.add("o");
            }

            checkWinner();
        }


        function checkWinner() {

            const winningPatterns = [

                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],

                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],

                [0, 4, 8],
                [2, 4, 6]

            ];


            for (let pattern of winningPatterns) {

                const a = pattern[0];
                const b = pattern[1];
                const c = pattern[2];


                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {

                    status.textContent =
                        "🎉 Player " + currentPlayer + " Wins!";

                    gameOver = true;

                    return;
                }
            }


            if (!board.includes("")) {

                status.textContent = "🤝 Game Draw!";

                gameOver = true;

                return;
            }


            currentPlayer =
                currentPlayer === "X" ? "O" : "X";

            status.textContent =
                "Player " + currentPlayer + " Turn";
        }


        function newGame() {

            board = [
                "", "", "",
                "", "", "",
                "", "", ""
            ];

            currentPlayer = "X";

            gameOver = false;


            cells.forEach(function(cell) {

                cell.textContent = "";

                cell.classList.remove("x");

                cell.classList.remove("o");

            });


            status.textContent = "Player X Turn";
        }

    </script>

</body>
</html>
